name: rakuxon
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [private]
  stop_grace_period: 30s
x-frontend: &frontend
  <<: *runtime
  environment:
    API_INTERNAL_URL: http://api:3001
    PORT: "3000"
    HOSTNAME: 0.0.0.0
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3
  mem_limit: 768m
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rakuxon
      POSTGRES_USER: rakuxon_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?required}
      DATABASE_APP_PASSWORD: ${DB_APP_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-rakuxon.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rakuxon_owner -d rakuxon]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 1g
  redis:
    <<: *runtime
    image: redis:7-alpine
    networks: [data]
    cap_drop: []
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
  migrate:
    <<: *runtime
    image: rakuxon-api:${BE_SHA:?required}
    restart: "no"
    profiles: [tools]
    networks: [data]
    env_file: /root/projects/rakuxon/secrets/migration.env
    command: [node, -r, reflect-metadata, ./node_modules/typeorm/cli.js, migration:run, -d, dist/database/data-source.js]
  api:
    <<: *runtime
    image: rakuxon-api:${BE_SHA:?required}
    build:
      context: ..
      target: runtime
    networks: [private, data]
    read_only: true
    tmpfs: [/tmp]
    env_file: ${RAKUXON_ENV_FILE:-/root/projects/rakuxon/secrets/api.env}
    environment:
      GIT_COMMIT_SHA: ${BE_SHA}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/v1/health').then(r=>r.json()).then(b=>{if(b.status!=='ok'||b.dependencies.database!=='up')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    mem_limit: 768m
  site:
    <<: *frontend
    image: rakuxon-site:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: base-site
        NEXT_PUBLIC_API_BASE_URL: /api
  partner:
    <<: *frontend
    image: rakuxon-partner:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: partner-app
        NEXT_PUBLIC_API_BASE_URL: /api
  schools:
    <<: *frontend
    image: rakuxon-schools:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: institution-portal
        NEXT_PUBLIC_API_BASE_URL: /api
  admin:
    <<: *frontend
    image: rakuxon-admin:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: admin
        NEXT_PUBLIC_API_BASE_URL: /api
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: rakuxon_gateway
    volumes: [./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [private, web]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/_health]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
networks:
  private: {}
  data:
    internal: true
  web:
    external: true
volumes:
  postgres_data:
  redis_data:
