name: rakuxon
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [private]
  stop_grace_period: 30s
x-frontend: &frontend
  <<: *runtime
  env_file: ../../frontend/.env.production
  environment:
    PORT: "3000"
    HOSTNAME: 0.0.0.0
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3
  mem_limit: 768m
services:
  migrate:
    <<: *runtime
    image: rakuxon-api:${BE_SHA:?required}
    restart: "no"
    profiles: [tools]
    networks: [web]
    env_file: ../.env.production
    command: [node, -r, reflect-metadata, ./node_modules/typeorm/cli.js, migration:run, -d, dist/database/data-source.js]
  api:
    <<: *runtime
    image: rakuxon-api:${BE_SHA:?required}
    build:
      context: ..
      target: runtime
    networks: [private, web]
    read_only: true
    tmpfs: [/tmp]
    env_file: ../.env.production
    environment:
      GIT_COMMIT_SHA: ${BE_SHA}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/v1/health').then(r=>r.json()).then(b=>{if(b.status!=='ok'||b.dependencies.database!=='up')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    mem_limit: 768m
  site:
    <<: *frontend
    image: rakuxon-site:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: base-site
        NEXT_PUBLIC_API_BASE_URL: /api
  partner:
    <<: *frontend
    image: rakuxon-partner:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: partner-app
        NEXT_PUBLIC_API_BASE_URL: /api
  schools:
    <<: *frontend
    image: rakuxon-schools:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: institution-portal
        NEXT_PUBLIC_API_BASE_URL: /api
  admin:
    <<: *frontend
    image: rakuxon-admin:${FE_SHA:?required}
    build:
      context: ../../frontend
      args:
        APP_NAME: admin
        NEXT_PUBLIC_API_BASE_URL: /api
  gateway:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: rakuxon_gateway
    volumes: [./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [private, web]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/_health]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
networks:
  private: {}
  web:
    external: true
