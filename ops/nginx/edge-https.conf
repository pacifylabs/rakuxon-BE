server {
    listen 80;
    server_name rakuxon.com www.rakuxon.com app.rakuxon.com schools.rakuxon.com admin.rakuxon.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.rakuxon.com;
    ssl_certificate /etc/letsencrypt/live/rakuxon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakuxon.com/privkey.pem;
    return 301 https://rakuxon.com$request_uri;
}
server {
    listen 443 ssl;
    server_name rakuxon.com app.rakuxon.com schools.rakuxon.com admin.rakuxon.com;
    ssl_certificate /etc/letsencrypt/live/rakuxon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakuxon.com/privkey.pem;
    # Cloudflare proxy ranges from https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # No access-log query strings containing reset/onboarding tokens.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /_health { return 404; }
    location / {
        set $rakuxon_gateway rakuxon_gateway:8080;
        proxy_pass http://$rakuxon_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
