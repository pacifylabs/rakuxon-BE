map $host $rakuxon_frontend {
    default site:3000;
    app.rakuxon.com partner:3000;
    schools.rakuxon.com schools:3000;
    admin.rakuxon.com admin:3000;
}
limit_req_zone $binary_remote_addr zone=rakuxon_auth:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;
    set_real_ip_from 172.18.0.0/16; # Existing VPS web network, verified at setup.
    real_ip_header X-Real-IP;
    # Log paths only: query strings can contain one-time tokens.
    access_log off;
    location = /_health { access_log off; return 200 'ok'; }
    location ~ ^/api/v1/(auth|admin-auth)/(login|register|password-reset/|verify-email/) {
        limit_req zone=rakuxon_auth burst=10 nodelay;
        limit_req_status 429;
        set $api api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/v1/ {
        set $api api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    # /api/catalogue belongs to Next.js; do not send it to Nest.
    location / {
        proxy_pass http://$rakuxon_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
