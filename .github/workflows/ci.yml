name: CI

on:
  push:
    branches: [main, 'stage/**', 'feature/**', 'fix/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Postgres and Redis: the e2e suite runs migrations and exercises
    # tenant filtering against a real database, which a mock cannot prove.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rakuxon
          POSTGRES_PASSWORD: rakuxon
          POSTGRES_DB: rakuxon
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rakuxon -d rakuxon"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      # The runtime role, deliberately not the owner: Postgres exempts
      # superusers from row-level security, so a suite run as one proves
      # nothing and a deployment run as one isolates nothing.
      DATABASE_URL: postgresql://rakuxon_app:rakuxon_app@localhost:5433/rakuxon
      DATABASE_APP_USER: rakuxon_app
      DATABASE_APP_PASSWORD: rakuxon_app
      DATABASE_SSL: 'false'
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-32
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-different-32
      WEB_APP_URL: http://localhost:3000
      GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile


      - name: Migrate
        run: pnpm migration:run

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      # docs/03-tdd-guide.md: red here means no merge, no exceptions. The
      # suite refuses to pass with no tests, so deleting it fails too.

      - name: Build
        run: pnpm build
